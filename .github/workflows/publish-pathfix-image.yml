name: Publish pathfix container

on:
  push:
    branches:
      - homelab/path-validation-fix-v1
    paths:
      - src/**
      - lib/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/publish-pathfix-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/legon85/obsidian-sync-mcp

jobs:
  test-build-publish:
    name: Test, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install, test and build
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm-cache \
            -v "$PWD:/app" \
            -w /app \
            node:22-bookworm \
            bash -lc '
              set -Eeuo pipefail
              npm ci
              npm test
              npm run build
            '

          test -f dist/main.js

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Build and publish image
        shell: bash
        run: |
          set -Eeuo pipefail

          SHORT_SHA="${GITHUB_SHA:0:12}"
          VERSION_TAG="${IMAGE_NAME}:0.6.0-pathfix1"
          REVISION_TAG="${IMAGE_NAME}:sha-${SHORT_SHA}"

          docker build \
            --pull \
            --label \
              "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label \
              "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label \
              "org.opencontainers.image.version=0.6.0-pathfix1" \
            --tag "$VERSION_TAG" \
            --tag "$REVISION_TAG" \
            .

          docker push "$VERSION_TAG"
          docker push "$REVISION_TAG"

          echo "Published: $VERSION_TAG"
          echo "Published: $REVISION_TAG"
